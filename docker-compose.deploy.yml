x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-ai_template_postgres}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deploy env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deploy env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deploy env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: ${ADMINER_CONTAINER_NAME:-ai_template_adminer}
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Только localhost: Docker открывает опубликованные порты в обход firewall, а Adminer — форма входа в БД.
      - '127.0.0.1:${ADMINER_PORT:-8081}:8080'

  backend:
    image: ${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE in the deploy env file}/ai-template-backend:${APP_IMAGE_TAG:-prod}
    container_name: ${BACKEND_CONTAINER_NAME:-ai_template_backend}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deploy env file}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in the deploy env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the deploy env file}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in the deploy env file}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      BOOTSTRAP_ADMIN_RESET_PASSWORD: ${BOOTSTRAP_ADMIN_RESET_PASSWORD:-false}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}
      AI_PROF_ORIENTATION_TIMEOUT_MS: ${AI_PROF_ORIENTATION_TIMEOUT_MS:-90000}
      AI_PROF_ORIENTATION_TIMEOUT_RETRIES: ${AI_PROF_ORIENTATION_TIMEOUT_RETRIES:-2}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-AI Template Admin}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_COUNT: ${BACKUP_MAX_COUNT:-30}
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-500}
    volumes:
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api-json'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: ${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE in the deploy env file}/ai-template-frontend:${APP_IMAGE_TAG:-prod}
    container_name: ${FRONTEND_CONTAINER_NAME:-ai_template_frontend}
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${APP_HTTP_PORT:-8080}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-ai_template_postgres_data}
  backups_data:
    name: ${BACKUPS_VOLUME_NAME:-ai_template_backups}
