name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

# A push that supersedes an in-flight run makes that run pointless; the release gate is long
# enough that leaving both to finish wastes real minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify template
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: my_app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d my_app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/my_app_db?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Setup npm
        run: npm install --global npm@11.19.0

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      # setup-node caches npm only. Without this, verify:e2e:critical downloads Chromium on
      # every run, because `playwright install` writes outside the npm cache.
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Verify template release gate
        run: npm run verify:template

      # verify:template regenerates the API client; a diff here means a DTO or dependency change
      # was committed without `npm run gen:api`. Checked in CI only: Linux checkouts are LF, so
      # the diff has no line-ending noise.
      - name: Generated API client is committed
        run: git diff --exit-code --stat -- client/src/shared/api

  # #136: what ships is the Docker images behind nginx, which `verify` never builds. This job runs
  # docker-compose.deploy.yml from freshly built images and drives it with a real browser, no mocks.
  prod-stack:
    name: Prod stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COMPOSE_STACK: docker compose -p ai_template_ci -f docker-compose.deploy.yml --env-file ci/prod-stack.env

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No push: the namespace in ci/prod-stack.env only names the local images.
      - name: Build production images
        run: docker compose -f docker-compose.build.yml --env-file ci/prod-stack.env build

      - name: Start the deploy stack
        run: $COMPOSE_STACK up -d --wait --wait-timeout 180

      - name: Smoke through nginx
        run: npm run verify:e2e:prod-stack

      - name: Stack logs
        if: failure()
        run: $COMPOSE_STACK logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: $COMPOSE_STACK down -v
