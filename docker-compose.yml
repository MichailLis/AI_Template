services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_template_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: my_app_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d my_app_db']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: ai_template_adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'

  backend:
    image: node:22-bookworm
    container_name: ai_template_backend
    working_dir: /app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:password@postgres:5432/my_app_db?schema=public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-http://localhost:5173}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-AI Template Admin}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-120000}
      OPENROUTER_PROF_ORIENTATION_TIMEOUT_MS: ${OPENROUTER_PROF_ORIENTATION_TIMEOUT_MS:-180000}
      OPENROUTER_PROF_ORIENTATION_TIMEOUT_RETRIES: ${OPENROUTER_PROF_ORIENTATION_TIMEOUT_RETRIES:-1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - ./server:/app
      - backend_node_modules:/app/node_modules
    command: >
      sh -lc "npm ci &&
      npm run prisma:generate &&
      npm run prisma:push &&
      npm run start:dev"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/api-json\").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: node:22-bookworm
    container_name: ai_template_frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -lc "npm ci &&
      npm run dev:container"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:5173/\").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
