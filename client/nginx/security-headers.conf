# Included at server level and again in every location with its own add_header:
# nginx drops inherited add_header as soon as a location declares one.
add_header X-Content-Type-Options "nosniff" always;
# /t/:code/result/:sessionToken is a bearer URL: external sites linked from the result get only the origin.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The access token sits in localStorage, so scripts come only from this origin. React style props need 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
