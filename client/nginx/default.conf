# Перебор паролей админки: вход проверяется медленным хешем, поэтому лимит по IP клиента.
# За другим прокси (балансировщик, Cloudflare) все приходят с его адреса: настройте real_ip_header.
limit_req_zone $binary_remote_addr zone=signin:1m rate=10r/m;

# Адреса сессии и результата ученика — bearer-ссылки: токен в access log не пишем.
# $request в формате не использовать: он содержит исходный URI.
map $request_uri $loggable_uri {
  ~^(?<head>.*/(?:sessions|session|result)/)[^/?]+(?<tail>.*)$  $head***$tail;
  default                                                        $request_uri;
}
log_format masked '$remote_addr - [$time_local] "$request_method $loggable_uri" $status $body_bytes_sent $request_time';

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/nginx/access.log masked;

  # Бэкенд ставит refresh-cookie на Path=/auth/refresh (без префикса /api, который срезает rewrite).
  proxy_cookie_path /auth/refresh /api/auth/refresh;

  client_max_body_size 10m;
  resolver 127.0.0.11 valid=30s ipv6=off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/xml
    image/svg+xml
    text/css
    text/plain;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /api {
    return 308 /api/;
  }

  location = /api/auth/signin {
    limit_req zone=signin burst=5 nodelay;
    limit_req_status 429;
    set $api_backend backend:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://$api_backend;
  }

  location /api/ {
    set $api_backend backend:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://$api_backend;
  }

  # Синхронные вызовы LLM: generate — один вызов, simulate — два подряд (каждый до AI_TIMEOUT_MS),
  # плюс повторы на 429/5xx. Таймаут по умолчанию (60 с) отдавал бы 504 при оплаченном запросе.
  location ~ ^/api/admin/prompts/(?:generate|simulate)$ {
    set $api_backend backend:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_read_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://$api_backend;
  }

  # Скачивание резервной копии БД: файл может быть большим, поэтому ответ идет потоком без
  # буферизации в nginx и с увеличенным таймаутом чтения.
  location /api/admin/backups/download/ {
    set $api_backend backend:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://$api_backend;
  }

  # Загрузка дампа в админке: тело идет потоком прямо в backend, без буфера nginx на диске.
  # Лимит чуть больше BACKUP_MAX_UPLOAD_MB по умолчанию (500 МБ); backend проверяет точный.
  location = /api/admin/backups/import {
    set $api_backend backend:3000;
    rewrite ^/api/(.*)$ /$1 break;
    client_max_body_size 520m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://$api_backend;
  }

  location ~* \.(?:css|js|mjs|map|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }
}
